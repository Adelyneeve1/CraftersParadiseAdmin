<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subscription Management</title>
  <link rel="stylesheet" href="subscription.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://smtpjs.com/v3/smtp.js"></script>
</head>
<body>
  <header class="header">
    <img src="images/logoo.png" alt="Logo" class="logo" />
    <h1 class="site-name">Crafters Paradise</h1>
  </header>

  <div class="container">
    <aside class="sidebar">
      <nav class="nav-menu">
        <ul>
          <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
          <li><a href="subscription.html" class="active"><i class="fas fa-box"></i> Subscription</a></li>
          <li><a href="settings.html"><i class="fas fa-cogs"></i> Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header><h2>SUBSCRIPTION MANAGER</h2></header>
      <section class="table-section">
        <button id="notify-all" style="margin-bottom: 15px;">Notify All Expiring Soon</button>
        <table>
          <thead>
            <tr>
              <th>Shop Name</th>
              <th>Email</th>
              <th>Plan</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Days Left</th> <!-- NEW -->
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subscription-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdp-AWmi1GrcrCYrEcog6rfhRygrt0uRc",
      authDomain: "craftersparadise-8c962.firebaseapp.com",
      projectId: "craftersparadise-8c962",
      storageBucket: "craftersparadise-8c962.appspot.com",
      messagingSenderId: "419818070255",
      appId: "1:419818070255:web:434b87d32020bf3aa67b1a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let userEmails = [];

    document.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        await loadShopSubscriptions();
      });

      document.getElementById("notify-all").addEventListener("click", notifyAllExpiringSoon);
    });

    async function loadShopSubscriptions() {
      const dbRef = ref(db);
      const [shopsSnap, usersSnap] = await Promise.all([
        get(child(dbRef, "shops")),
        get(child(dbRef, "users"))
      ]);
    
      if (!shopsSnap.exists() || !usersSnap.exists()) return;
    
      const shops = shopsSnap.val();
      const users = usersSnap.val();
      const tbody = document.getElementById("subscription-tbody");
    
      Object.entries(shops).forEach(([shopId, shop]) => {
        const shopName = shop.storeName || "N/A";
        const ownerId = shop.ownerId || "";
        const user = users[ownerId] || {};
        const email = user.email || "N/A";
        const plan = shop.plan || "Monthly";
    
        // Format subscription start date and calculate end date
        let startDate = user.subscriptionStartDate || "N/A";
        let endDate = "N/A";
        let daysLeftText = "N/A";
        let status = "Inactive";
    
        if (startDate !== "N/A") {
          const startObj = new Date(startDate);
          const options = { day: '2-digit', month: 'long', year: 'numeric' };
          startDate = startObj.toLocaleDateString('en-US', options);
    
          // End date = start date + 1 month
          const endObj = new Date(startObj);
          endObj.setMonth(endObj.getMonth() + 1);
          endDate = endObj.toLocaleDateString('en-US', options);
    
          const today = new Date();
          const daysLeft = Math.ceil((endObj - today) / (1000 * 60 * 60 * 24));
          daysLeftText = daysLeft > 0 ? `${daysLeft} days` : "Expired";
          status = daysLeft > 0 ? "Active" : "Inactive";
        }
    
        if (status === "Inactive") {
          userEmails.push({ email, shopName, endDate });
        }
    
        const notifyButton = status === "Inactive"
          ? `<button class="notify" onclick="sendNotification('${email}', '${shopName}', '${endDate}')">Notify</button>`
          : `<button class="notify" disabled>Notify</button>`;
    
        const row = `
          <tr>
            <td>${shopName}</td>
            <td>${email}</td>
            <td>${plan}</td>
            <td>${startDate}</td>
            <td>${endDate}</td>
            <td>${daysLeftText}</td>
            <td><span class="status ${status.toLowerCase()}">${status}</span></td>
            <td>
              <button class="view" onclick="goToProfile('${ownerId}')">View</button>
              ${notifyButton}
            </td>
          </tr>`;
        tbody.innerHTML += row;
      });
    }
    
    
    

    window.sendNotification = function(email, shopName, endDate) {
      Email.send({
        SecureToken: "your-secure-token", // Replace with your SMTPJS token
        To: email,
        From: "you@example.com",
        Subject: "Subscription Expiring Soon",
        Body: `Dear ${shopName}, your subscription will expire on ${endDate}. Please renew soon.`
      }).then(() => alert(`Notification sent to ${email}`));
    };

    window.notifyAllExpiringSoon = function() {
      userEmails.forEach(({ email, shopName, endDate }) => {
        sendNotification(email, shopName, endDate);
      });
    };

    window.goToProfile = function (ownerId) {
      if (!ownerId) {
        alert("No user ID found.");
        return;
      }
      localStorage.setItem('selectedOwnerId', ownerId);
      window.location.href = 'user-profile.html';
    };
  </script>
</body>
</html>
