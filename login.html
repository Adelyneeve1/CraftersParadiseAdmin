<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <div id="spinner-overlay" class="spinner-overlay">
    <img src="images/logoo.png" alt="Loading..." class="loading-logo" />
  </div>
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
 
  <div class="background-image">
    <div class="login-container">
      <img src="images/logoo.png" alt="Logo" class="logo" />
      <form onsubmit="handleLogin(event)">
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required />
          <i class="fas fa-eye toggle-eye" onclick="togglePassword()" style="cursor:pointer; margin-left: 450px;"></i>
        </div>
        <button type="submit" class="login-button">LOGIN</button>
      
        
        <div id="error-message" class="error-message" style="display: none;"></div>
      </form>
    </div>
  </div>

  <!-- Modular Firebase SDK (no compat, no source map issues) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdp-AWmi1GrcrCYrEcog6rfhRygrt0uRc",
      authDomain: "craftersparadise-8c962.firebaseapp.com",
      projectId: "craftersparadise-8c962",
      storageBucket: "craftersparadise-8c962.appspot.com",
      messagingSenderId: "419818070255",
      appId: "1:419818070255:web:434b87d32020bf3aa67b1a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePassword = () => {
      const pwd = document.getElementById("password");
      pwd.type = pwd.type === "password" ? "text" : "password";
    };

    window.handleLogin = async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      const spinner = document.getElementById('spinner-overlay');
      const loginButton = document.querySelector('.login-button');

      loginButton.style.display = 'none';
      spinner.style.display = 'inline-block';
      errorMessage.style.display = 'none';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const docRef = doc(db, "admins", user.uid);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          throw new Error('You are not authorized as an admin.');
        }

        localStorage.setItem('adminId', user.uid);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error("Login error:", error);
        showError(error.message);
      } finally {
        loginButton.style.display = 'block';
        spinner.style.display = 'none';
      }
    };

    function showError(message) {
      const errorMessage = document.getElementById('error-message');
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }
  </script>
</body>
</html>
