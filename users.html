<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Manager</title>
  <link rel="stylesheet" href="users.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header class="header">
    <img src="images/logoo.png" alt="Logo" class="logo" />
    <h1 class="site-name">Crafters Paradise</h1>
  </header>
  <div id="spinner-overlay" class="spinner-overlay">
    <img src="images/logoo.png" alt="Loading..." class="loading-logo" />
  </div>
  
  <div class="container">
    <aside class="sidebar">
      <nav class="nav-menu">
        <ul>
          <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li><a href="users.html" class="active"><i class="fas fa-users"></i> Users</a></li>
          <li><a href="subscription.html"><i class="fas fa-box"></i> Subscription</a></li>
          <li><a href="settings.html"><i class="fas fa-cogs"></i> Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header><h2>ACCOUNT MANAGER</h2></header>
      <section class="user-tables">
        <div class="table-section">
          <h3>ARTISANS</h3>
          <table>
            <thead><tr><th>NAME</th><th>EMAIL</th><th>CONTACT NO</th></tr></thead>
            <tbody id="artisan-tbody"></tbody>
          </table>
        </div>

        <div class="table-section">
          <h3>SHOPS (BUSINESS OWNERS)</h3>
          <table>
            <thead><tr><th>NAME</th><th>SHOP NAME</th><th>EMAIL</th><th>CONTACT NO</th></tr></thead>
            <tbody id="shop-tbody"></tbody>
          </table>
        </div>

        <div class="table-section">
          <h3>CUSTOMERS</h3>
          <table>
            <thead><tr><th>NAME</th><th>EMAIL</th><th>CONTACT NO</th></tr></thead>
            <tbody id="customer-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdp-AWmi1GrcrCYrEcog6rfhRygrt0uRc",
      authDomain: "craftersparadise-8c962.firebaseapp.com",
      projectId: "craftersparadise-8c962",
      storageBucket: "craftersparadise-8c962.appspot.com",
      messagingSenderId: "419818070255",
      appId: "1:419818070255:web:434b87d32020bf3aa67b1a",
      databaseURL: "https://craftersparadise-8c962-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbStore = getFirestore(app);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = "admin_login.html";
          return;
        }

        const docSnap = await getDoc(doc(dbStore, "admins", user.uid));
        if (!docSnap.exists()) {
          alert("Access denied. Admins only.");
          window.location.href = "admin_login.html";
          return;
        }

        loadUsers();
      });
    });

    async function loadUsers() {
      const spinner = document.getElementById("spinner-overlay");
      spinner.style.display = "flex";
    
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, "users"));
      if (!snapshot.exists()) {
        spinner.style.display = "none";
        return;
      }
    
      const users = snapshot.val();
    
      for (const [uid, user] of Object.entries(users)) {
        const name = `${user.firstName || ""} ${user.lastName || ""}`.trim();
        const email = user.email || "N/A";
        const phone = user.phone || "N/A";
        const type = (user.userType || "").toLowerCase();
    
        const nameLink = `<a href="#" onclick="goToProfile('${uid}')">${name}</a>`;
    
        if (type === "artisan") {
          document.getElementById("artisan-tbody").innerHTML += `
            <tr><td>${nameLink}</td><td>${email}</td><td>${phone}</td></tr>`;
        } else if (type.includes("business")) {
          let storeName = "N/A";
          if (user.shopId) {
            try {
              const shopSnap = await get(child(dbRef, `shops/${user.shopId}`));
              if (shopSnap.exists()) {
                storeName = shopSnap.val().storeName || "N/A";
              }
            } catch (e) {
              console.warn(`Failed to load shop for ${uid}`, e);
            }
          }
          document.getElementById("shop-tbody").innerHTML += `
            <tr><td>${nameLink}</td><td>${storeName}</td><td>${email}</td><td>${phone}</td></tr>`;
        } else if (type === "buyer") {
          document.getElementById("customer-tbody").innerHTML += `
            <tr><td>${nameLink}</td><td>${email}</td><td>${phone}</td></tr>`;
        }
      }
    
      spinner.style.display = "none";
    }
    

    window.goToProfile = function (uid) {
      if (!uid) {
        alert("No user ID found.");
        return;
      }
      localStorage.setItem('selectedOwnerId', uid);
      window.location.href = 'users_prof.html';
    };
  </script>
</body>
</html>
